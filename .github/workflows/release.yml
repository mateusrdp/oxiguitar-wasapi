# Test builds and releases (#165). The work is oxiguitar's reusable workflow
# plugin-release.yml: it runs build-oxp.sh on each system and makes a zip per
# target, a .deb and an .rpm (oxiguitar-wasapi), a per-user Windows installer, a macOS
# .pkg and SHA256SUMS.
#
# - On a pull request, and on a push to develop or main: nothing is
#   released. The files stay under the run for 14 days, with a ~dev version;
#   those are the test builds.
# - On a pushed v* tag (only the maintainer makes them; v plus the version in
#   Cargo.toml): a DRAFT release holding all of it. Publishing the draft
#   starts publish.yml.
name: Release

on:
  pull_request:
  push:
    branches: [develop, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    uses: mateusrdp/oxiguitar/.github/workflows/plugin-release.yml@dad955db8ddfe8dceee32bf6e1799fc424dbca6f
    with:
      name: wasapi
      title: "WASAPI audio"
      description: "Plays OxiGuitar's sound through WASAPI, Windows' own sound system."
      # ci.yml has run the tests on six systems.
      test: false
      systems: windows
      tools-ref: dad955db8ddfe8dceee32bf6e1799fc424dbca6f
    permissions:
      contents: write
